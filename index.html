<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>
<style>
body {
  background: linear-gradient(to right, #ff758c, #ff7eb3);
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  color: white;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
  background: rgba(255,255,255,0.15);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}
input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  width: 80%;
  margin: 15px 0;
}
button {
  background: #ff4d6d;
  border: none;
  color: white;
  padding: 12px 25px;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
}
button:hover { background: #ff1f4a; }
</style>
</head>

<body>

<div class="container" id="game">
  <h1>❤️ A Little Love Game ❤️</h1>
  <h2 id="question"></h2>
  <input type="text" id="answer" placeholder="Your answer here...">
  <br>
  <button onclick="checkAnswer()">Next</button>
</div>

<script>
const questions = [
  { q: "When was the first time we met? 💕", a: "19 july 2025" },
  { q: "What was the name of the hotel I proposed to you? 💍", a: "river view city central" },
  { q: "What was the first dessert we had together? 🍨", a: "alcohol ice cream" },
  { q: "Who loves you more? 😘", a: "me" }
];

let current = 0;

function showQuestion() {
  document.getElementById("question").innerText = questions[current].q;
}

function checkAnswer() {
  const ans = document.getElementById("answer").value.toLowerCase().trim();
  if(ans === questions[current].a) {
    current++;
    document.getElementById("answer").value = "";
    if(current < questions.length) {
      showQuestion();
    } else {
      document.getElementById("game").innerHTML = `
        <h1>💖 Will You Be My Valentine? 💖</h1>
        <h2>Every moment with you is my favorite moment.</h2>
        <h2>🌹 Be mine forever 🌹</h2>
        <button onclick="alert('She said YES 😍')">YES 💕</button>
      `;
    }
  } else {
    alert("Oops 😜 Try again, my love ❤️");
  }
}

showQuestion();
</script>

</body>
</html>
